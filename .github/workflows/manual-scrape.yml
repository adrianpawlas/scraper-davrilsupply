name: Manual Davril Supply Scrape

on:
  workflow_dispatch:
    inputs:
      categories:
        description: 'Categories to scrape (comma-separated, leave empty for all)'
        required: false
        default: ''
        type: string
      test_mode:
        description: 'Run in test mode (only scrape first category)'
        required: false
        default: 'false'
        type: boolean

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Configure scraper for specific categories
      if: github.event.inputs.categories != ''
      run: |
        echo "CUSTOM_CATEGORIES=${{ github.event.inputs.categories }}" >> $GITHUB_ENV

    - name: Run scraper
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        CUSTOM_CATEGORIES: ${{ env.CUSTOM_CATEGORIES }}
      run: |
        if [ "${{ github.event.inputs.test_mode }}" = "true" ]; then
          echo "Running in test mode..."
          python test_scraper.py
        else
          echo "Running full scraper..."
          python run_full_scraper.py
        fi

    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: scraper-logs-${{ github.run_number }}
        path: |
          *.log
          scraper.log